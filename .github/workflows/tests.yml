name: Tester

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Endast python-docx behövs i CI (DOCX-roundtrip-testet).
      # UI-testerna behöver PyQt6 och hoppas över automatiskt utan den.
      - name: Installera testberoenden
        run: pip install python-docx==1.1.2
      - name: Kompilera alla Python-filer
        run: python -m compileall -q main.pyw core ui script tests
      - name: Kör enhetstester
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testa Thunderbird-protokoll
        run: node tests/test_thunderbird_protocol.js

  windows-startup-syntax:
    runs-on: windows-latest
    strategy:
      matrix:
        host-python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera PowerShell och VBS utan installation
        shell: powershell
        run: |
          foreach ($file in @('tools/ensure_python.ps1', 'tools/weekly_python.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
          . ./tools/weekly_python.ps1
          $cases = @(
            @('2026-11-09T07:59:59', '2026-11-02T08:00:00'),
            @('2026-11-09T08:00:00', '2026-11-09T08:00:00'),
            @('2026-11-15T23:59:59', '2026-11-09T08:00:00'),
            @('2026-11-16T08:00:00', '2026-11-16T08:00:00')
          )
          foreach ($case in $cases) {
            if ((Get-PythonMaintenanceSlot ([datetime]$case[0])).ToString('s') -ne $case[1]) { throw 'Wrong weekly slot' }
          }
          $state = Join-Path $env:TEMP 'mailoffer-week-test.json'
          [IO.File]::WriteAllText($state, '{"slot":"2026-11-09T08:00:00"}')
          if (Test-PythonMaintenanceDue $state ([datetime]'2026-11-16T07:59:59')) { throw 'Early update' }
          if (-not (Test-PythonMaintenanceDue $state ([datetime]'2026-11-16T08:00:00'))) { throw 'Missed update' }
          [IO.File]::WriteAllText($state, 'corrupt')
          if (-not (Test-PythonMaintenanceDue $state)) { throw 'Corrupt state must retry' }
          foreach ($file in @('Starta EmailApp.vbs', 'tools/weekly_python.vbs', 'tools/python_bootstrap.vbs')) {
            $source = [IO.File]::ReadAllText((Join-Path $pwd $file))
            $probe = Join-Path $env:TEMP 'mailoffer-syntax-only.vbs'
            $source = $source.Replace('Option Explicit', "Option Explicit`r`nWScript.Quit 0")
            [IO.File]::WriteAllText($probe, $source, [Text.Encoding]::ASCII)
            & cscript.exe //nologo $probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Testa flera Python-launchers med separata sökvägar
        shell: powershell
        run: ./tests/test_python_launchers.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.host-python }}
      - name: Kontrollera system-Python från PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          $output = & $exe -I (Join-Path $pwd 'tools/probe_system_python.py') 2>$null
          if ($LASTEXITCODE -ne 0 -or "$output" -notmatch '^\d+\.\d+$') { throw 'Interpreter probe failed' }
      - name: Installera Qt för hostens fokustest
        run: python -m pip install --quiet PyQt6
      - name: Testa verklig EXE-host och dolt Qt-fönsters enkelinstans
        run: |
          $env:MAILOFFER_TEST_QT = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          python tools/run_native_tests.py
      - name: Testa dagsarkivering med öppna Windows-loggfiler
        run: python tools/run_native_tests.py test_log_compaction.py
